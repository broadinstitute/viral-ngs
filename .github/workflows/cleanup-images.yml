name: Cleanup Feature Branch Images

# Deletes a branch's quay.io image tags when the branch is deleted. The logic and its
# safety rails live in .github/scripts/quay_delete_branch_tags.py (see issue #1125).
# Run it by hand (Run workflow, with a branch name) to clean up tags left behind, e.g.
# when a branch is deleted while its docker.yml build is still pushing. Manual runs are
# dry runs unless "execute" is checked.

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch whose quay.io tags to delete, as pushed (e.g. feature/foo)'
        required: true
        type: string
      execute:
        description: 'Delete the tags (unchecked = dry run)'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  cleanup-quay-images:
    # Branch deletions only (not tags), and skip main
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Delete branch tags from Quay
        env:
          # Passed through env rather than interpolated into the script, so a branch
          # name can't inject shell commands.
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.ref }}
          EXECUTE: ${{ github.event_name == 'delete' || inputs.execute }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          if [[ "$EXECUTE" == "true" ]]; then
            python3 .github/scripts/quay_delete_branch_tags.py --execute
          else
            python3 .github/scripts/quay_delete_branch_tags.py
          fi
